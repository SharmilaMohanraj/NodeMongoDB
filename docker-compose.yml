services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      MONGODB_URI: mongodb://mongo:27017/hrdb?replicaSet=rs0
      MONGODB_DB: hrdb
      JWT_SECRET: development-only-change-me
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.3.8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      # The first check initializes a fresh volume; later checks only pass once
      # this node has elected itself writable primary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost --eval "try { const status = rs.status(); if (status.set !== 'rs0' || !status.members.some((member) => member.self && member.stateStr === 'PRIMARY')) quit(1); } catch (error) { try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); } catch (initError) {} quit(1); }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
